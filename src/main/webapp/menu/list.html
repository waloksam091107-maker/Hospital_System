<script type="text/javascript">


    function loadMenuCategories(){
        $.ajax({
            url: '/menu/categories',
            type: 'GET',
            dataType: "json",
            success: function (res) {

                console.log("res",res)
                $.each(res, function (i, v) {
                    var optionObj = $("<option value='"+v.fenlei+"'>"+v.fenlei+"</option>");

                    optionObj.appendTo($("select[name='deptId']"));


                });


            }
        });
    }





    function f1(id){
        if(confirm("您确定要删除吗?")){
            window.location.href = "/menu/del?id=" + id; // 确认后重定向到/del的servlet并传递id
        }
    }

    function loadMenuPage(p,fenlei){
        // alert("000")
        $.ajax({
            url: '/menu/list',
            type: 'GET',
            data: {"pageNum":p, "fenlei":fenlei},

            dataType: "json",
            success: function (res) {
                // alert("111")
                console.log("res",res)
                $("#docBody").empty();
                $.each(res.list, function (i, v) {
                    var trObj = $("<tr></tr>");
                    trObj.append($("<td>" + v.id + "</td>"));
                    trObj.append($("<td>" + v.name + "</td>"));
                    trObj.append($("<td>" + v.price + "</td>"));
                    trObj.append($("<td>" + v.fenlei + "</td>"));
                    var modifyUrl = "/menu/edit-page?id=" + v.id + "&name=" + encodeURIComponent(v.name) + "&price=" + v.price + "&fenlei=" + encodeURIComponent(v.fenlei);
                    var deleteUrl = "/doctors/delete?doctorId=" + v.doctorId;

                    var modifyButton = $("<a class='button border-main' href='" + modifyUrl + "'><span class='icon-edit'></span> 修改</a>");

                    var deleteButton = $('<a class="button border-red" onclick="f1(\'' + v.id + '\')"><span class="icon-trash-o"></span> 删除</a>');

                    var buttonGroup = $("<div class='button-group'></div>");
                    buttonGroup.append(modifyButton);
                    buttonGroup.append(deleteButton);

                    trObj.append($("<td></td>").append(buttonGroup));


                    trObj.appendTo($("#docBody"));


                });

                $(".pagelist span").remove()

                for(var i=0;i<res.pages;i++){
                    var $span=$("<span onclick='changePage($(this).html())'>"+(i+1)+"</span>")

                    if((i+1)==res.pageNum){
                        $span.attr("class","current")
                    }
                    $("#next").before($span)
                }
            }
        });
    }
    $(function(){
        loadMenuPage(1,"-1");  //-1代表所有分类
        loadMenuCategories();
    })
    function changePage(p){
        var $fenlei=$("select[name='fenLei'] option:selected").val();
        //
        loadMenuPage(p,$fenlei)
        //alert($fenlei)
    }


    function nextPage(){  //也要带trim那一堆代码的数据！！
        //获取当前页码
        var currentPageNumber =$("span[class='current']").text()
        var $fenlei=$("select[name='fenLei'] option:selected").val();
        // 获取总页数
        var totalPages = $(".pagelist span").length;

        if (Number(currentPageNumber) < totalPages) {
            // 如果当前页码小于总页数，则加载下一页
            loadMenuPage(Number(currentPageNumber) + 1, $fenlei);
        } else {
            // 否则，弹出提示
            alert("已经是最后一页了");
        }
        //
        // loadMenuPage(Number(currentPageNumber)+1,$fenlei)  //1+1=11? zhuanshuzi

    }
    function prePage(){
        //获取当前页码
        var currentPageNumber =$("span[class='current']").text()
        var $fenlei=$("select[name='fenLei'] option:selected").val();
        if (Number(currentPageNumber) > 1) {
            // 如果当前页码大于1，则加载上一页
            loadMenuPage(Number(currentPageNumber) - 1, $fenlei);
        } else {
            // 否则，弹出提示
            alert("已经是第一页了");
        }
        //
        //
        // loadMenuPage(Number(currentPageNumber)-1,$fenlei)  //1+1=11? zhuanshuzi
    }

    //批量复制

        if (Checkbox){
            var i = 0;
            $("input[name='id[]']").each(function(){
                if (this.checked==true) {
                    i++;
                }
            });
            if(i>1){
                alert("只能选择一条信息!");
                $(o).find("option:first").prop("selected","selected");
            }else{

            }
        }
        else{
