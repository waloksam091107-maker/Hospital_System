<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
  <title>医院挂号系统</title>
  <!-- Fav Icon -->
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
  <!-- Stylesheets -->
  <link href="static/css/font-awesome-all.css" rel="stylesheet">
  <link href="static/css/flaticon.css" rel="stylesheet">
  <link href="static/css/owl.css" rel="stylesheet">
  <link href="static/css/bootstrap.css" rel="stylesheet">
  <link href="static/css/jquery.fancybox.min.css" rel="stylesheet">
  <link href="static/css/animate.css" rel="stylesheet">
  <link href="static/css/color.css" rel="stylesheet">
  <link href="static/css/nice-select.css" rel="stylesheet">
  <link href="static/css/style.css" rel="stylesheet">
  <link href="static/css/responsive.css" rel="stylesheet">
  <style>
    body {
      font-family: 'Roboto', sans-serif;
      background-color: #f4f4f9;
      color: #333;
    }
    h1{
      color: #3fc1c9;
      font-size: 36px;
      margin-bottom: 20px;
    }
    h2{
      color: #3fc1c9;
      font-size: 24px;
      margin-bottom: 20px;
    }
    p{
      margin: revert;
    }
    .container {
      max-width: 800px;
      margin: 50px auto;
      padding: 20px;
      background-color: #fff;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
      border-radius: 8px;
    }
    label {
      display: block;
      margin-bottom: 10px;
      font-weight: bold;
    }
    input[type="date"] {
      width: calc(100% - 22px);
      padding: 10px;
      margin-bottom: 20px;
      border: 1px solid #ccc;
      border-radius: 4px;
    }
    button {
      background-color: #3fc1c9;
      color: white;
      padding: 10px 20px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      transition: background-color 0.3s;
    }
    button:hover {
      background-color: #3fc1c9;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 20px;
    }
    table, th, td {
      border: 1px solid #ddd;
    }
    th, td {
      padding: 15px;
      text-align: left;
    }
    th {
      background-color: #3fc1c9;
      color: white;
    }
    tr:nth-child(even) {
      background-color: #f9f9f9;
    }
    .total-row {
      font-weight: bold;
      background-color: #f4f4f9;
    }
  </style>
</head>
<body>
<div class="container">
  <h1>医院管理系统 - 收入报表</h1>
  <label for="date">选择日期：</label>
  <input type="date" id="date" name="date">
  <button id="queryButton">查询</button>
  <p>注：查询日期为当日日期，查询结果仅包含当日的订单。</p>
  <h2>统计结果：</h2>
  <div id="report"></div>
</div>

<script src="/js/jquery-3.7.1.min.js"></script>
<script type="text/javascript">
  $(document).ready(function () {
    $("#queryButton").click(function () {
      const date = $("#date").val();
      console.log("查询日期：" + date);
      if (!date) {
        alert('请选择一个日期');
        return;
      }

      $.ajax({
        url: "/admins/sum",
        type: "POST",
        dataType: "json",
        data: {"date": date},
        success: function (res) {
          $("#report").empty();

          if (res.length === 0) {
            $("#report").append('<p>无相关记录</p>');
            return;
          }

          let totalIncome = 0;
          let table = '<table><tr><th>订单ID</th><th>医生姓名</th><th>患者姓名</th><th>缴费金额</th></tr>';

          res.forEach(order => {
            const amount = parseFloat(order.status.replace(/[^\d.]/g, ''));
            table += '<tr>' +
                    '<td>' + order.orderId + '</td>' +
                    '<td>' + order.doctorName + '</td>' +
                    '<td>' + order.patientName + '</td>' +
                    '<td>' + amount + '</td>' +
                    '</tr>';

            if (!isNaN(amount)) {
              totalIncome += amount;
            }
          });

          table += '<tr class="total-row"><td colspan="3">总收入</td><td>' + totalIncome + ' 元</td></tr>';
          table += '</table>';

          $("#report").append(table);
        },
        error: function (XMLHttpRequest, textStatus, errorThrown) {
          alert("获取报表失败！");
        }
      });
    });
  });
</script>
</body>
</html>
