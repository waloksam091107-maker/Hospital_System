<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>确认预约挂号</title>
  <script src="../js/jquery-3.7.1.min.js"></script>
  <style>
    *{box-sizing:border-box}body{margin:0;background:#eff8f7;color:#183354;font:16px/1.65 Arial,"Microsoft YaHei",sans-serif}main{max-width:680px;margin:32px auto;padding:0 20px}.card{background:white;border:1px solid #dce7e7;border-radius:14px;padding:28px;box-shadow:0 5px 24px #1231}h1{margin:0 0 8px;font-size:28px}.hint{color:#526779;margin:0 0 20px}dl{margin:20px 0}dl div{display:flex;justify-content:space-between;gap:20px;border-bottom:1px solid #e4eded;padding:12px 0}dt{color:#526779}dd{margin:0;text-align:right;overflow-wrap:anywhere;max-width:70%}.fee{font-size:23px;font-weight:bold;color:#137c73}.notice{font-size:14px;background:#f0f8f7;padding:12px;border-radius:6px}.actions{display:flex;flex-direction:column;gap:12px}button{font:inherit;padding:12px 20px;border:0;border-radius:7px;background:#137c73;color:white;font-weight:bold;cursor:pointer}button:disabled{background:#9daeb0;cursor:wait}a{color:#196a74}#bookingMessage{min-height:26px;margin:12px 0;color:#b82b24}.success{color:#117a5d!important}@media(max-width:600px){main{margin:18px auto;padding:0 14px}.card{padding:20px}h1{font-size:25px}}
  </style>
</head>
<body>
<main>
  <p><a id="backToDoctor" href="appointment-departments.html">← 返回选择医生与时段</a></p>
  <section class="card" aria-labelledby="bookingTitle">
    <h1 id="bookingTitle">确认预约挂号</h1>
    <p class="hint">请核对就诊信息，挂号费从当前患者账号余额扣除。</p>
    <dl>
      <div><dt>就诊医生</dt><dd id="docname">正在读取…</dd></div>
      <div><dt>就诊日期</dt><dd id="date">—</dd></div>
      <div><dt>就诊时段</dt><dd id="time">—</dd></div>
      <div><dt>挂号费</dt><dd id="004" class="fee">正在读取…</dd></div>
    </dl>
    <p class="notice">预约成功后，请于预约当天到院签到。取消预约不自动退款，改期请在预约记录中办理。</p>
    <p id="bookingMessage" role="alert" aria-live="polite"></p>
    <div class="actions"><button id="005" type="button" disabled>确认预约并支付挂号费</button><a href="patient.jsp">查看我的预约记录</a></div>
  </section>
</main>
<script>
const appContext = window.location.pathname.split('/hospro/')[0];
function appUrl(path) { return appContext + path; }
$(function () {
    let csrfToken = '', doctorReady = false, busy = false, booked = false;
    const urlParams = new URLSearchParams(window.location.search);
    function feedback(text, success) { $('#bookingMessage').text(text || '').toggleClass('success', !!success); }
    function controls() { $('#005').prop('disabled', busy || booked || !csrfToken || !doctorReady).text(busy ? '正在预约，请稍候…' : booked ? '预约成功，正在跳转…' : '确认预约并支付挂号费'); }
    function buildBookingRequest() {
        const doctorId = urlParams.get('doctor_id'), appointmentDate = urlParams.get('date'), appointmentTime = urlParams.get('time');
        if (!/^[1-9]\d*$/.test(doctorId || '') || !/^\d{4}-\d{2}-\d{2}$/.test(appointmentDate || '') || ['AM', 'PM', 'EVENING'].indexOf(appointmentTime) < 0) return null;
        return { doctorId: doctorId, appointment_date: appointmentDate, appointment_time: appointmentTime };
    }
    const bookingRequest = buildBookingRequest();
    if (!bookingRequest) { feedback('预约信息不完整或已失效，请返回医生页面重新选择。'); return; }
    $('#date').text(bookingRequest.appointment_date);
    $('#time').text({ AM: '上午', PM: '下午', EVENING: '晚间' }[bookingRequest.appointment_time]);
    $('#backToDoctor').attr('href', 'doctors-details.html?doctorId=' + encodeURIComponent(bookingRequest.doctorId));
    $.getJSON(appUrl('/security/csrf')).done(function (response) {
        csrfToken = response && response.token ? response.token : '';
        if (!csrfToken) feedback('安全校验初始化失败，请刷新页面重试。');
        controls();
    }).fail(function () { feedback('安全校验初始化失败，请刷新页面或重新登录。'); });
    $.getJSON(appUrl('/doctors/details'), { doctorId: bookingRequest.doctorId }).done(function (doctor) {
        const fee = doctor && Number(doctor.registrationFee);
        if (!doctor || !doctor.name || !Number.isFinite(fee) || fee < 0) { feedback('医生或挂号费信息读取失败，请返回重新选择。'); return; }
        $('#docname').text(doctor.name);
        $('#004').text('¥' + fee.toFixed(2));
        doctorReady = true; controls();
    }).fail(function () { feedback('医生信息读取失败，请刷新页面重试。'); });
    $('#005').on('click', function () {
        if (busy || booked || !csrfToken || !doctorReady) return;
        busy = true; feedback(''); controls();
        $.ajax({ url: appUrl('/appointments/book'), type: 'POST', dataType: 'json', headers: { 'X-CSRF-Token': csrfToken }, data: bookingRequest })
          .done(function (response) {
              if (response.success) { booked = true; feedback(response.message || '预约成功。', true); window.location.href = appUrl('/doctor-schedule/confirm.html'); }
              else feedback(response.message || '预约失败，请刷新号源后重试。');
          }).fail(function (xhr) { feedback((xhr.responseJSON && xhr.responseJSON.message) || '预约未完成，请确认已登录患者账号后重试。'); })
          .always(function () { busy = false; controls(); });
    });
});
</script>
<script src="static/js/legacy-navigation-guard.js"></script><script src="../js/clinic-navigation.js"></script><script src="../js/notification-center.js"></script><script src="../js/booking-capacity.js"></script>
</body></html>
