<style>*{box-sizing:border-box}body{margin:0;background:#eef8f7;color:#183354;font:16px/1.8 system-ui,sans-serif}main{max-width:680px;margin:48px auto;padding:24px}article{background:white;padding:28px;border-radius:14px;box-shadow:0 5px 24px #1231}h1{font-size:26px}li{margin:12px 0}a{color:#137c73}nav{display:flex;gap:24px;flex-wrap:wrap}@media(max-width:600px){main{margin:16px auto;padding:14px}article{padding:20px}}</style></head>
<body><main><article><h1>找回密码</h1><p>忘记密码时，请联系系统管理员核验账号身份后重置密码。</p><ol><li>向管理员提供账号及登录身份（患者、医生或管理员），不要发送原密码。</li><li>管理员在“账号安全管理”中设置临时密码，并通过双方约定的方式交付。</li><li>使用临时密码登录，按页面提示设置自己的新密码。修改完成后重新登录。</li></ol><p>本系统目前使用管理员重置流程，暂未提供短信或邮件自助找回。若账号因连续登录失败被短时锁定，可等待锁定到期或联系管理员解锁。</p><nav><a href="login.html">返回登录</a><a href="index.html">返回首页</a></nav></article></main></body></html>
