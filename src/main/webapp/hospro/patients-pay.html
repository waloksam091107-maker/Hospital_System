<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>模拟充值 - 医院挂号系统</title><link href="static/css/bootstrap.css" rel="stylesheet">
<style>body{background:#eef8f7;color:#16365c}.card{max-width:680px;margin:48px auto;border:0;border-radius:14px;box-shadow:0 10px 28px #1232}.error{color:#b42318;min-height:24px}.success{color:#147a4d}th,td{padding:.45rem;border-bottom:1px solid #d9e4e7;text-align:left}</style></head>
<body><main class="card p-4 p-md-5"><a href="index.html">← 返回首页</a><h1 class="h3 mt-3">账户模拟充值</h1>
<p class="text-muted">仅用于本系统演示，不接入真实支付，也不会要求输入账户密码或身份证号。单次充值金额为 0.01 至 10000.00 元。</p>
<form id="rechargeForm"><label class="form-label">充值金额（元）<input class="form-control" name="amount" type="number" min="0.01" max="10000" step="0.01" required></label><p id="message" class="error mt-3" role="alert"></p><button class="btn btn-primary" type="submit">确认模拟充值</button></form>
<hr><h2 class="h5">最近余额流水</h2><table class="w-100"><thead><tr><th>时间</th><th>类型</th><th>金额</th><th>余额</th></tr></thead><tbody id="records"><tr><td colspan="4">正在读取…</td></tr></tbody></table></main>
<script>
(function(){let csrf='',saving=false;const message=document.getElementById('message');const records=document.getElementById('records');const url='../portal/balance/recharge';
async function json(path,options){const response=await fetch(path,options);const data=await response.json();if(!response.ok)throw data;return data;}
function text(value){return value===undefined||value===null?'':String(value);}
function render(items){records.innerHTML='';if(!items.length){records.innerHTML='<tr><td colspan="4">暂无流水。</td></tr>';return;}items.forEach(function(item){const row=document.createElement('tr');[item.createdAt,item.transactionType,item.amount,item.balanceAfter].forEach(function(value){const cell=document.createElement('td');cell.textContent=text(value);row.appendChild(cell);});records.appendChild(row);});}
async function load(){csrf=(await json('../security/csrf')).token;render((await json(url)).transactions||[]);}
document.getElementById('rechargeForm').addEventListener('submit',async function(event){event.preventDefault();if(saving)return;const form=event.currentTarget,button=form.querySelector('[type=submit]');saving=true;button.disabled=true;try{const data=await json(url,{method:'POST',headers:{'X-CSRF-Token':csrf,'Content-Type':'application/x-www-form-urlencoded'},body:new URLSearchParams(new FormData(form))});message.className='success';message.textContent=data.message;form.reset();await load();}catch(data){message.className='error';message.textContent=data.message||'充值失败，请稍后重试。';}finally{saving=false;button.disabled=false;}});load().catch(function(data){message.textContent=data.message||'无法读取余额流水，请先以患者身份登录。';records.innerHTML='<tr><td colspan="4">无法读取。</td></tr>';});}());
</script></body></html>
