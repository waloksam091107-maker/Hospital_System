<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>医生详情与预约号源</title><script src="../js/jquery-3.7.1.min.js"></script>
  <style>
    *{box-sizing:border-box}body{margin:0;background:#eff8f7;color:#183354;font:16px/1.65 Arial,"Microsoft YaHei",sans-serif}main{max-width:1060px;margin:28px auto;padding:0 20px}a{color:#196a74}.layout{display:grid;grid-template-columns:1.15fr 1fr;gap:24px;align-items:start}.card{background:white;border:1px solid #dce7e7;border-radius:14px;padding:26px;box-shadow:0 5px 24px #1231}.identity{display:flex;align-items:center;gap:20px}.image-box{margin:0;flex-shrink:0}.image-box img{width:100px;height:100px;border-radius:12px;object-fit:cover}.name h2{font-size:26px;margin:0 0 6px;overflow-wrap:anywhere}.muted,.designation{color:#526779}.identity p{margin:3px 0}h1,h2,h3{line-height:1.35}h1{font-size:26px;margin-top:0}h3{font-size:18px;margin:24px 0 10px}.biography{white-space:pre-wrap;overflow-wrap:anywhere}dl div{display:flex;justify-content:space-between;gap:16px;padding:10px 0;border-bottom:1px solid #e4eded}dt{color:#526779}dd{margin:0;text-align:right;overflow-wrap:anywhere}label{display:block}input[type=date]{width:100%;font:inherit;padding:10px;border:1px solid #bccfd0;border-radius:6px;margin:8px 0 18px}fieldset{padding:0;border:0;margin:0 0 20px}.periods{display:flex;gap:10px;flex-wrap:wrap}.custom-check-box label{padding:9px 14px;border:1px solid #bdd3d2;border-radius:6px;cursor:pointer}.custom-check-box input{margin-right:6px}button{font:inherit;padding:12px 18px;border:0;border-radius:7px;background:#137c73;color:white;cursor:pointer;width:100%;font-weight:bold}button:disabled{background:#9daeb0;cursor:wait}.notice{font-size:14px;color:#526779}#detailMessage{color:#b82b24;min-height:26px;margin:12px 0}@media(max-width:700px){main{padding:0 14px;margin:18px auto}.layout{grid-template-columns:1fr;gap:16px}.card{padding:20px}.image-box img{width:76px;height:76px}.identity{gap:14px}.name h2{font-size:23px}}
  </style>
</head>
<body><main>
  <p><a href="appointment-departments.html">← 返回科室与医生列表</a></p>
  <div class="layout">
    <section class="card" aria-label="医生信息">
      <div class="identity"><figure class="image-box"><img src="static/picture/author-1.png" alt="医生头像"></figure><div class="name"><h2>正在读取医生信息…</h2><p class="designation"></p><p id="professionalTitle" class="muted"></p></div></div>
      <div id="001"><p>科室：正在读取…</p></div>
      <dl><div><dt>联系电话</dt><dd id="doctorPhone">—</dd></div><div><dt>挂号费</dt><dd id="003">—</dd></div></dl>
      <h3 id="002">医生简介</h3><p id="doctorIntroduction" class="biography">正在读取…</p>
    </section>
    <section class="card" aria-labelledby="appointmentTitle">
      <h1 id="appointmentTitle">选择就诊日期与时段</h1>
      <p class="notice">余号会随预约实时变化，确认页将显示本次挂号费。</p>
      <form id="appointmentForm">
        <label for="datepicker">就诊日期</label><input type="date" name="date" id="datepicker" required>
        <fieldset><legend>就诊时段</legend><div class="periods">
          <div class="custom-check-box"><label><input type="radio" name="appointmentTime" value="AM" required>上午</label></div>
          <div class="custom-check-box"><label><input type="radio" name="appointmentTime" value="PM">下午</label></div>
          <div class="custom-check-box"><label><input type="radio" name="appointmentTime" value="EVENING">晚间</label></div>
        </div></fieldset>
        <p id="detailMessage" role="alert" aria-live="polite"></p>
        <button id="book-btn" type="submit" disabled>查询并确认预约</button>
      </form>
      <p class="notice">预约当天到院签到。取消预约不自动退款；改期请在预约记录中办理。</p>
    </section>
  </div>
</main>
<script>
const appContext = window.location.pathname.split('/hospro/')[0];
function appUrl(path) { return appContext + path; }
function doctorAvatarUrl(value) {
    if (!value) return 'static/picture/author-1.png';
    return /^uploads\/avatars\/[A-Za-z0-9._-]+$/.test(value) ? appUrl('/' + value) : '/hos_images/' + encodeURIComponent(value);
}
$(function () {
    const doctorId = new URLSearchParams(window.location.search).get('doctorId');
    let ready = false, busy = false;
    function message(text) { $('#detailMessage').text(text || ''); }
    function controls() { $('#book-btn').prop('disabled', !ready || busy).text(busy ? '正在查询号源…' : '查询并确认预约'); }
    if (!/^[1-9]\d*$/.test(doctorId || '')) { $('.name h2').text('请选择医生'); message('医生编号无效，请返回科室与医生列表重新选择。'); return; }
    const parts = new Intl.DateTimeFormat('en-CA', { timeZone: 'Asia/Shanghai', year: 'numeric', month: '2-digit', day: '2-digit' }).formatToParts(new Date());
    const datePart = type => parts.find(p => p.type === type).value;
    $('#datepicker').attr('min', datePart('year') + '-' + datePart('month') + '-' + datePart('day'));
    $.ajax({ type: 'GET', url: appUrl('/doc/findById'), data: { doctorId: doctorId }, dataType: 'json' })
      .done(function (doc) {
          if (!doc || String(doc.doctorId) !== doctorId || !doc.name) { message('医生信息读取失败，请重新选择。'); return; }
          $('.name h2').text(doc.name); $('.designation').text('工号：' + (doc.jobNumber || '未提供'));
          $('#professionalTitle').text((doc.professionalTitles || {}).titleName || '职称未提供');
          $('#001 p').text('科室：' + ((doc.departments || {}).departmentName || '未提供'));
          $('#doctorPhone').text(doc.phone || '未提供'); $('#003').text(doc.registrationFee == null ? '未提供' : '¥' + doc.registrationFee);
          $('#doctorIntroduction').text(doc.introduction || '暂无医生简介。');
          $('.image-box img').one('error', function () { this.src = 'static/picture/author-1.png'; }).attr('src', doctorAvatarUrl(doc.avatar));
          ready = true; controls();
      }).fail(function () { $('.name h2').text('医生信息未加载'); message('医生信息读取失败，请刷新页面重试。'); });
    $('#appointmentForm').on('submit', function (event) {
        event.preventDefault(); if (!ready || busy) return;
        const date = $('#datepicker').val(), selectedSlots = $('.custom-check-box input:checked');
        if (!date || selectedSlots.length !== 1) { message('请选择日期，并且一次只能选择一个上午、下午或晚间时段。'); return; }
        const selectedTime = selectedSlots.first().val();
        busy = true; message(''); controls();
        $.ajax({ url: appUrl('/appointments/availability'), type: 'POST', data: { doctor_id: doctorId, date: date, time: selectedTime }, dataType: 'json' })
          .done(function (response) {
              if (response.available) {
                  const params = new URLSearchParams({ doctor_id: doctorId, date: date, time: selectedTime });
                  window.location.href = 'book-appointment.html?' + params.toString();
              } else message(response.message || '所选时段没有可预约号源，请选择其他日期或时段。');
          }).fail(function (xhr) { message((xhr.responseJSON && xhr.responseJSON.message) || '号源查询失败，请确认已登录患者账号后重试。'); })
          .always(function () { busy = false; controls(); });
    });
});
</script>
<script src="../js/clinic-navigation.js"></script><script src="../js/notification-center.js"></script><script src="../js/booking-capacity.js"></script>
</body></html>
