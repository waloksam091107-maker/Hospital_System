<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
    <title>个人资料 - 医院挂号系统</title><link href="static/css/bootstrap.css" rel="stylesheet">
    <style>body{background:#eef8f7;color:#16365c}.card{max-width:720px;margin:48px auto;border:0;border-radius:14px;box-shadow:0 10px 28px #1232}.error{color:#b42318;min-height:24px}.success{color:#147a4d}</style>
</head>
<body><main class="card p-4 p-md-5"><a href="index.html">← 返回首页</a><h1 class="h3 mt-3">个人资料</h1>
    <form id="profileForm"><p id="identity" class="text-muted"></p><label class="form-label">姓名<input id="name" class="form-control" disabled></label>
        <label class="form-label mt-3">联系电话<input id="phone" class="form-control" name="phone" maxlength="50"></label>
        <label class="form-label mt-3">邮箱<input id="email" class="form-control" type="email" name="email" maxlength="255"></label>
        <label id="introBox" class="form-label mt-3 d-none">个人简介<textarea id="introduction" class="form-control" name="introduction" maxlength="2000"></textarea></label>
        <p id="balance" class="mt-3"></p><p id="message" class="error" role="alert"></p><button class="btn btn-primary" type="submit">保存资料</button></form>
    <hr><h2 class="h5">头像</h2><form id="avatarForm"><input type="file" name="avatar" accept="image/png,image/jpeg,image/webp" required><button class="btn btn-outline-primary" type="submit">上传头像</button></form></main>
<script>
(function(){let csrf='';const message=document.getElementById('message');const profileUrl='../portal/profile';const avatarUrl='../portal/profile/avatar';
 async function json(url,options){const r=await fetch(url,options);const data=await r.json();if(!r.ok)throw data;return data;}
 async function load(){csrf=(await json('../security/csrf')).token;const p=await json(profileUrl);document.getElementById('name').value=p.name||'';document.getElementById('phone').value=p.phone||'';document.getElementById('email').value=p.email||'';document.getElementById('identity').textContent=(p.role||'')+' · '+(p.jobNumber||p.username||p.idCardNumber||'');if(p.role==='DOCTOR'){document.getElementById('introBox').classList.remove('d-none');document.getElementById('introduction').value=p.introduction||'';}if(p.role==='PATIENT')document.getElementById('balance').textContent='当前余额：'+(p.balance||'0.00');}
 document.getElementById('profileForm').addEventListener('submit',async e=>{e.preventDefault();try{const d=await json(profileUrl,{method:'POST',headers:{'X-CSRF-Token':csrf,'Content-Type':'application/x-www-form-urlencoded'},body:new URLSearchParams(new FormData(e.currentTarget))});message.className='success';message.textContent=d.message;}catch(d){message.className='error';message.textContent=d.message||'保存失败。';}});
 document.getElementById('avatarForm').addEventListener('submit',async e=>{e.preventDefault();try{const d=await json(avatarUrl,{method:'POST',headers:{'X-CSRF-Token':csrf},body:new FormData(e.currentTarget)});message.className='success';message.textContent=d.message;}catch(d){message.className='error';message.textContent=d.message||'头像上传失败。';}});load().catch(d=>{message.textContent=d.message||'无法读取个人资料。';});}());
</script></body></html>
