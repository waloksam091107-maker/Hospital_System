<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>患者注册 - 医院挂号系统</title>
    <link href="static/css/bootstrap.css" rel="stylesheet">
    <style>body{background:#eef8f7;color:#16365c}.card{max-width:620px;margin:48px auto;border:0;border-radius:14px;box-shadow:0 10px 28px #1232}.hint{color:#60758c}.error{color:#b42318;min-height:24px}.success{color:#147a4d}</style>
</head>
<body>
<main class="card p-4 p-md-5">
    <h1 class="h3">患者注册</h1>
    <p class="hint">医生和管理员账号由管理员在后台创建。本页面不使用短信或邮件验证码。</p>
    <form id="registrationForm">
        <label class="form-label">姓名<input class="form-control" name="name" required maxlength="100"></label>
        <label class="form-label mt-3">身份证号<input class="form-control" name="idCardNumber" required maxlength="18"></label>
        <label class="form-label mt-3">联系电话（可选）<input class="form-control" name="phone" maxlength="50"></label>
        <label class="form-label mt-3">邮箱（可选）<input class="form-control" name="email" type="email" maxlength="255"></label>
        <label class="form-label mt-3">密码<input class="form-control" name="password" type="password" required minlength="8" maxlength="128"></label>
        <label class="form-label mt-3">确认密码<input class="form-control" name="confirmPassword" type="password" required minlength="8" maxlength="128"></label>
        <p id="message" class="error mt-3" role="alert"></p>
        <button class="btn btn-primary" type="submit">注册患者账号</button>
        <a class="btn btn-link" href="login.html?typeId=2">已有账号，去登录</a>
    </form>
</main>
<script>
(function () {
    const form = document.getElementById('registrationForm');
    const message = document.getElementById('message');
    let csrf = '';
    fetch('../portal/accounts/csrf').then(function (response) { return response.json(); }).then(function (data) { csrf = data.token || ''; }).catch(function () { message.textContent = '无法初始化请求校验，请刷新页面后重试。'; });
    form.addEventListener('submit', async function (event) {
        event.preventDefault();
        const values = new FormData(form);
        if (values.get('password') !== values.get('confirmPassword')) { message.textContent = '两次输入的密码不一致。'; return; }
        if (!csrf) { message.textContent = '请求校验尚未完成，请稍后重试。'; return; }
        const response = await fetch('../portal/accounts/patient-register', {method: 'POST', headers: {'X-CSRF-Token': csrf}, body: new URLSearchParams(values)});
        const data = await response.json();
        message.className = data.success ? 'success mt-3' : 'error mt-3';
        message.textContent = data.message || '请求失败，请稍后重试。';
        if (data.success) form.reset();
    });
}());
</script>
</body>
</html>
