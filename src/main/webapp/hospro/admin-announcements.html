<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>公告管理 - 医院挂号系统</title>
    <style>
        *{box-sizing:border-box}body{margin:0;background:#f2f8f8;color:#183153;font:14px/1.5 "Microsoft YaHei",sans-serif}header{padding:18px max(24px,calc((100vw - 1000px)/2));background:#14365d;color:#fff;display:flex;gap:16px;align-items:center}h1{font-size:22px;margin:0}header a{margin-left:auto;color:#d9ffff;text-decoration:none}main{max-width:1000px;margin:28px auto;padding:0 16px}.card{padding:22px;background:#fff;border-radius:9px;box-shadow:0 4px 18px #16345912}label{display:block;margin:12px 0 4px;color:#52677e}input,textarea{width:100%;padding:8px;border:1px solid #dce5ee;border-radius:4px;font:inherit}textarea{min-height:190px;resize:vertical}button{background:#14365d;color:#fff;border:0;border-radius:5px;padding:9px 14px;cursor:pointer;margin:14px 7px 0 0}.secondary{background:#60758c}.danger{background:#b63838}.publish{background:#118b69}.result{min-height:20px;color:#235b3c}.error{color:#b63838}.item{border-top:1px solid #dce5ee;padding:15px 0}.item h2{margin:0 0 4px;font-size:18px}.meta{color:#687b8f}.content{white-space:pre-wrap;margin:8px 0}.hint{color:#687b8f}
    </style>
</head>
<body>
<header><h1>公告管理</h1><span>仅管理员可发布和维护公告</span><a href="adm_main.jsp">返回管理主页</a></header>
<main><div class="card"><p class="hint">新建公告初始为草稿；发布后才会在门户公告页显示。下线不删除内容。</p><form id="announcement-form"><input type="hidden" name="announcementId"><label>公告标题<input name="title" required maxlength="255"></label><label>公告正文<textarea name="content" required maxlength="10000"></textarea></label><button type="submit">保存草稿</button><button class="secondary" type="button" id="reset">新建公告</button></form><p id="result" class="result" aria-live="polite"></p><div id="items"></div></div></main>
<script>
(function () {
    'use strict';
    var marker = '/hospro/', path = location.pathname;
    var context = path.indexOf(marker) >= 0 ? path.substring(0, path.indexOf(marker)) : '';
    var api = context + '/portal/admin/announcements', csrf = '';
    var form = document.getElementById('announcement-form'), items = document.getElementById('items'), result = document.getElementById('result');
    function show(message, error) { result.textContent = message || ''; result.className = error ? 'result error' : 'result'; }
    function request(url, options) { return fetch(url, options).then(function (response) { return response.json().catch(function () { return {}; }).then(function (body) { if (!response.ok) throw new Error(body.message || '请求失败（' + response.status + '）'); return body; }); }); }
    function headers() { return { 'X-CSRF-Token': csrf, 'Content-Type': 'application/x-www-form-urlencoded;charset=UTF-8' }; }
    function reset() { form.reset(); form.dataset.mode = 'create'; show(''); }
    function post(action, id) { var data = new URLSearchParams(); data.set('action', action); data.set('announcementId', id); return request(api, { method: 'POST', headers: headers(), body: data.toString() }); }
    function actionButton(label, className, click) { var button = document.createElement('button'); button.type = 'button'; button.textContent = label; button.className = className || ''; button.addEventListener('click', click); return button; }
    function load() {
        request(api).then(function (body) {
            items.textContent = '';
            (body.items || []).forEach(function (row) {
                var article = document.createElement('article'), title = document.createElement('h2'), meta = document.createElement('div'), content = document.createElement('p');
                article.className = 'item'; title.textContent = row.title; meta.className = 'meta';
                meta.textContent = '状态：' + (row.status || '-') + ' · 创建：' + (row.creationTime || '-') + (row.publishedAt ? ' · 发布：' + row.publishedAt : '');
                content.className = 'content'; content.textContent = row.content;
                article.appendChild(title); article.appendChild(meta); article.appendChild(content);
                article.appendChild(actionButton('编辑', '', function () { form.dataset.mode = 'update'; form.elements.announcementId.value = row.announcementId; form.elements.title.value = row.title || ''; form.elements.content.value = row.content || ''; show('正在编辑该公告。'); form.scrollIntoView({ behavior: 'smooth', block: 'center' }); }));
                if (row.status !== 'PUBLISHED') article.appendChild(actionButton('发布', 'publish', function () { post('publish', row.announcementId).then(function (body) { show(body.message); load(); }).catch(function (error) { show(error.message, true); }); }));
                if (row.status === 'PUBLISHED') article.appendChild(actionButton('下线', 'secondary', function () { post('offline', row.announcementId).then(function (body) { show(body.message); load(); }).catch(function (error) { show(error.message, true); }); }));
                article.appendChild(actionButton('删除', 'danger', function () { if (!confirm('确定删除该公告吗？')) return; post('delete', row.announcementId).then(function (body) { show(body.message); load(); }).catch(function (error) { show(error.message, true); }); }));
                items.appendChild(article);
            });
        }).catch(function (error) { show(error.message, true); });
    }
    form.addEventListener('submit', function (event) { event.preventDefault(); var data = new URLSearchParams(new FormData(form)); data.set('action', form.dataset.mode || 'create'); request(api, { method: 'POST', headers: headers(), body: data.toString() }).then(function (body) { show(body.message); reset(); load(); }).catch(function (error) { show(error.message, true); }); });
    document.getElementById('reset').addEventListener('click', reset);
    request(context + '/security/csrf').then(function (body) { csrf = body.token || body.csrfToken || ''; if (!csrf) throw new Error('未能获取安全令牌，请重新登录。'); load(); }).catch(function (error) { show(error.message, true); });
}());
</script>
</body>
</html>
