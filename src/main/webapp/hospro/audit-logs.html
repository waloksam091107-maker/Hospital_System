<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>安全审计日志</title><script src="static/js/jquery.js"></script>
<style>
body{font-family:Arial,"Microsoft YaHei",sans-serif;background:#f4fbfa;color:#183354}.wrap{max-width:1200px;margin:35px auto;background:#fff;padding:28px;border-radius:10px}
form{display:flex;flex-wrap:wrap;gap:12px;align-items:end}label{display:flex;flex-direction:column;gap:5px}input,select,button{font:inherit;padding:7px}button{cursor:pointer}table{border-collapse:collapse;width:100%}th,td{padding:10px;border-bottom:1px solid #dfe8ea;text-align:left;font-size:14px}.scroll{overflow-x:auto}.error{color:#bd3126}.paging{display:flex;gap:12px;align-items:center;margin-top:18px}
</style></head><body><main class="wrap">
<p><a href="index.html?roleCode=3">← 管理主页</a></p><h1>安全审计日志</h1><p>仅显示操作元数据，不显示密码、病历正文或身份证号。结束时间不包含在查询范围内。</p>
<form id="queryForm"><label>开始时间 <input id="start" type="datetime-local" step="1"></label><label>结束时间 <input id="end" type="datetime-local" step="1"></label>
<label>角色 <select id="role"><option value="">全部</option><option>DOCTOR</option><option>PATIENT</option><option>ADMIN</option></select></label>
<label>操作人编号 <input id="actorId" inputmode="numeric" placeholder="例如 1"></label><label>动作 <input id="action" maxlength="80" placeholder="例如 LOGIN"></label>
<label>结果 <select id="outcome"><option value="">全部</option><option>SUCCESS</option><option>FAILURE</option></select></label>
<button id="searchButton" type="submit">查询</button><button id="resetButton" type="button">清空</button></form>
<p id="message" role="status">正在加载…</p><div class="scroll"><table><thead><tr><th>时间</th><th>角色</th><th>账号</th><th>动作</th><th>目标类型</th><th>目标编号</th><th>结果</th></tr></thead><tbody id="auditRows"></tbody></table></div>
<div class="paging"><button id="previousPage" type="button" disabled>上一页</button><span id="pageInfo"></span><button id="nextPage" type="button" disabled>下一页</button></div>
</main><script>
(function(){
  var contextPath=window.location.pathname.substring(0,window.location.pathname.indexOf('/hospro/'))||'';
  var currentPage=1, pages=1, loading=false;
  function dateValue(id){var value=$(id).val(); if(!value)return ''; value=value.replace('T',' '); return value.length===16?value+':00':value;}
  function query(page){
    if(loading)return; loading=true; $('#message').removeClass('error').text('正在加载…'); $('#previousPage,#nextPage').prop('disabled',true);
    var data={start:dateValue('#start'),end:dateValue('#end'),role:$('#role').val(),actorId:$('#actorId').val(),action:$('#action').val().trim(),outcome:$('#outcome').val(),page:page,pageSize:20};
    $.getJSON(contextPath+'/audit-logs/search',data).done(function(result){
      currentPage=result.page; pages=Math.max(1,Math.ceil(result.total/result.pageSize)); var body=$('#auditRows').empty();
      result.rows.forEach(function(item){var row=$('<tr>'); [item.createdAt,item.actorRole||'匿名',item.actorId==null?'-':item.actorId,item.action,item.targetType||'-',item.targetId||'-',item.outcome].forEach(function(value){row.append($('<td>').text(value==null?'':value));});body.append(row);});
      $('#message').text(result.total?'共 '+result.total+' 条记录。':'没有符合条件的记录。'); $('#pageInfo').text('第 '+currentPage+' / '+pages+' 页');
      $('#previousPage').prop('disabled',currentPage<=1); $('#nextPage').prop('disabled',currentPage>=pages);
    }).fail(function(xhr){$('#auditRows').empty();$('#pageInfo').text('');$('#message').addClass('error').text((xhr.responseJSON&&xhr.responseJSON.message)||'查询失败，请稍后重试。');}).always(function(){loading=false;});
  }
  $('#queryForm').on('submit',function(event){event.preventDefault();query(1);});
  $('#resetButton').on('click',function(){$('#queryForm')[0].reset();query(1);});
  $('#previousPage').on('click',function(){if(currentPage>1)query(currentPage-1);});
  $('#nextPage').on('click',function(){if(currentPage<pages)query(currentPage+1);});
  query(1);
}());
</script></body></html>
