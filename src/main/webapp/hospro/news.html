<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>医院公告 - 医院挂号系统</title>
    <style>*{box-sizing:border-box}body{margin:0;background:#f2f8f8;color:#183153;font:15px/1.65 "Microsoft YaHei",sans-serif}header{background:#14365d;color:#fff;padding:19px max(24px,calc((100vw - 960px)/2));display:flex;align-items:center;gap:18px}h1{margin:0;font-size:23px}a{color:#d9ffff;text-decoration:none;margin-left:auto}main{max-width:960px;margin:30px auto;padding:0 16px}.notice{background:#fff;padding:20px 22px;border-radius:9px;box-shadow:0 4px 18px #16345912;border-top:4px solid #21b7ad;margin-bottom:16px}.notice h2{margin:0 0 5px;font-size:20px}.meta{color:#718197;font-size:13px}.content{white-space:pre-wrap;margin:12px 0 0}.empty{padding:30px;text-align:center;color:#687b8f}</style>
</head>
<body><header><h1>医院公告</h1><a href="index.html">返回首页</a></header><main id="list"><div class="empty">正在读取公告…</div></main>
<script>
(function(){var marker='/hospro/',path=location.pathname,context=path.indexOf(marker)>=0?path.substring(0,path.indexOf(marker)):'',list=document.getElementById('list');fetch(context+'/announcements/list').then(function(response){if(!response.ok)throw new Error();return response.json()}).then(function(items){list.textContent='';if(!items.length){list.innerHTML='<div class="empty">暂时没有已发布公告。</div>';return}items.forEach(function(item){var article=document.createElement('article'),title=document.createElement('h2'),meta=document.createElement('div'),content=document.createElement('p');article.className='notice';title.textContent=item.title;meta.className='meta';meta.textContent=(item.publishedAt||item.creationTime||'')+(item.creator?' · '+item.creator:'');content.className='content';content.textContent=item.content;article.appendChild(title);article.appendChild(meta);article.appendChild(content);list.appendChild(article)})}).catch(function(){list.innerHTML='<div class="empty">公告读取失败，请稍后重试。</div>'})}());
</script></body></html>
